version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: glamstore_db
    restart: always
    environment:
      MYSQL_DATABASE: glamstoredb
      MYSQL_ROOT_PASSWORD: "0000"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./glamstoredb.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --init-file=/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p0000"]
      timeout: 20s
      retries: 10
      interval: 5s

  web:
    build: .
    container_name: glamstore_web
    command: >
      sh -c "sleep 20 &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=True
      - MYSQL_DATABASE=glamstoredb
      - MYSQL_USER=root
      - MYSQL_PASSWORD=0000
      - MYSQL_HOST=db
      - MYSQL_PORT=3306

volumes:
  mysql_data:
